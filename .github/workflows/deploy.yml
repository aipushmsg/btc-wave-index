# 部署到 GitHub Pages：纯静态站，无构建步骤，整仓即站点。
# push 到 main 自动部署；也可在 Actions 页手动触发（workflow_dispatch）。
# 首次运行会通过 configure-pages 自动启用仓库的 Pages（build_type=workflow），
# 线上地址：https://aipushmsg.github.io/btc-wave-index/
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
